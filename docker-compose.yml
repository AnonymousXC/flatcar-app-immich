version: "3.8"

# =============================================================================
# Docker Compose reference for local testing
# This is NOT used by Flatcar — Flatcar uses systemd units directly.
# Use this for development/testing on non-Flatcar systems.
# =============================================================================

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    command: ['start.sh', 'immich']
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      test: curl -f http://localhost:2283/api/server-info/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      test: curl -f http://localhost:3003/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME} || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: immich_nginx
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./nginx/immich.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - immich-server
    restart: always

volumes:
  pgdata:
  model-cache:
